<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Admin - Escola Comércio Lisboa</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f1ef;
    color:#222;
}

.top{
    background:#1f3a68;
    color:white;
    padding:14px 18px;
    font-size:15px;
}

.top a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.wrap{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border:1px solid #d4d4d0;
    border-radius:4px;
    padding:16px;
    margin-top:15px;
}

h1{
    margin:0 0 5px;
}

h2{
    margin-top:0;
}

.mut{
    color:#6b6b6b;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    padding:9px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:4px;
    font:inherit;
}

button{
    border:0;
    border-radius:4px;
    padding:9px 14px;
    cursor:pointer;
    background:#1f3a68;
    color:white;
    font:inherit;
}

button:hover{
    opacity:.9;
}

.delete{
    background:#a83232;
}

.edit{
    background:#1f3a68;
}

.logout{
    background:#555;
}

.login{
    max-width:400px;
    margin:80px auto;
}

.tabs{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:20px;
}

.tab{
    background:#ddd;
    color:#222;
}

.tab.active{
    background:#1f3a68;
    color:white;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:#f5f5f5;
    border:1px solid #ddd;
    padding:18px;
    text-align:center;
    border-radius:4px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    color:#1f3a68;
}

.item{
    border-top:1px solid #ddd;
    padding:15px 0;
}

.item:first-child{
    border-top:0;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
}

.rating{
    background:#f8f8f8;
    border:1px solid #ddd;
    padding:12px;
    margin-top:10px;
    border-radius:4px;
}

.hidden{
    display:none;
}

.message{
    margin-top:8px;
    color:#6b6b6b;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .tabs{
        flex-direction:column;
    }

    .tab{
        width:100%;
    }

}

</style>
</head>

<body>

<div id="loginScreen" class="login">

    <div class="card">

        <h2>Menu Admin</h2>

        <p class="mut">
            Introduza a chave de acesso.
        </p>

        <input
            id="adminKey"
            type="password"
            placeholder="Chave de acesso"
        >

        <button onclick="login()">
            Entrar
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<div id="adminScreen" class="hidden">

    <div class="top">

        <b>Escola Comércio Lisboa</b>
        · Menu Admin

        <a href="index.html">
            Voltar ao site
        </a>

    </div>


    <div class="wrap">

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">

            <div>
                <h1>Menu Admin</h1>
                <div class="mut">
                    Gestão do site
                </div>
            </div>

            <button class="logout" onclick="logout()">
                Sair
            </button>

        </div>


        <div class="tabs">

            <button
                class="tab active"
                onclick="openTab('stats',this)"
            >
                Estatísticas
            </button>

            <button
                class="tab"
                onclick="openTab('teachers',this)"
            >
                Professores
            </button>

            <button
                class="tab"
                onclick="openTab('ratings',this)"
            >
                Avaliações
            </button>

            <button
                class="tab"
                onclick="openTab('addTeacher',this)"
            >
                Adicionar professor
            </button>

        </div>


        <!-- ESTATÍSTICAS -->

        <div id="stats" class="tab-content active">

            <div class="card">

                <h2>Estatísticas</h2>

                <div class="stats">

                    <div class="stat">

                        <div class="stat-number" id="statTeachers">
                            0
                        </div>

                        <div>
                            Professores
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-number" id="statRatings">
                            0
                        </div>

                        <div>
                            Avaliações
                        </div>

                    </div>


                    <div class="stat">

                        <div class="stat-number" id="statComments">
                            0
                        </div>

                        <div>
                            Comentários
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- PROFESSORES -->

        <div id="teachers" class="tab-content">

            <div class="card">

                <h2>Professores</h2>

                <input
                    id="teacherSearch"
                    placeholder="Pesquisar professor..."
                    oninput="renderTeachers()"
                >

                <div id="teacherList">
                    A carregar...
                </div>

            </div>

        </div>


        <!-- AVALIAÇÕES -->

        <div id="ratings" class="tab-content">

            <div class="card">

                <h2>Avaliações</h2>

                <input
                    id="ratingSearch"
                    placeholder="Pesquisar professor ou comentário..."
                    oninput="renderRatings()"
                >

                <div id="ratingList">
                    A carregar...
                </div>

            </div>

        </div>


        <!-- ADICIONAR PROFESSOR -->

        <div id="addTeacher" class="tab-content">

            <div class="card">

                <h2>Adicionar professor</h2>

                <input
                    id="newTeacherName"
                    placeholder="Nome do professor"
                    maxlength="60"
                >

                <input
                    id="newTeacherSubject"
                    placeholder="Disciplina / função"
                    maxlength="60"
                >

                <button onclick="addTeacher()">
                    Adicionar professor
                </button>

                <div id="addMessage" class="message"></div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>

var SUPABASE_URL =
"https://qsnncbwoybwkhwyepaai.supabase.co";

var SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbm5jYndveWJ3a2h3eWVwYWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjUxMjEsImV4cCI6MjEwNjI0MTEyMX0.RWSTvm_FuJq7FDPiYErHgsTOHPmktgnEG2eKMtNc5TE";

var ADMIN_KEY = "1M178_Jdh";


var sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


var teachers = [];
var ratings = [];


function esc(text){

    var div = document.createElement("div");

    div.textContent = text == null ? "" : text;

    return div.innerHTML;

}


/* LOGIN */

function login(){

    var key =
        document.getElementById("adminKey").value;

    if(key === ADMIN_KEY){

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("adminScreen")
            .classList.remove("hidden");

        loadData();

    }else{

        document
            .getElementById("loginMessage")
            .textContent =
            "Chave de acesso incorreta.";

    }

}


function logout(){

    location.reload();

}


document
    .getElementById("adminKey")
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){
            login();
        }

    });


/* TABS */

function openTab(id,button){

    document
        .querySelectorAll(".tab-content")
        .forEach(function(tab){

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".tab")
        .forEach(function(tab){

            tab.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");


    button.classList.add("active");

}


/* LOAD DATA */

function loadData(){

    Promise.all([

        sb
            .from("teachers")
            .select("*")
            .order("name"),

        sb
            .from("ratings")
            .select("*")
            .order("id",{ascending:false})

    ]).then(function(result){

        if(result[0].error){

            console.error(result[0].error);

            alert("Erro ao carregar professores.");

            return;

        }


        if(result[1].error){

            console.error(result[1].error);

            alert("Erro ao carregar avaliações.");

            return;

        }


        teachers = result[0].data || [];

        ratings = result[1].data || [];


        updateStats();

        renderTeachers();

        renderRatings();

    });

}


/* STATS */

function updateStats(){

    document
        .getElementById("statTeachers")
        .textContent =
        teachers.length;


    document
        .getElementById("statRatings")
        .textContent =
        ratings.length;


    document
        .getElementById("statComments")
        .textContent =
        ratings.filter(function(r){

            return r.comment &&
                   r.comment.trim() !== "";

        }).length;

}


/* TEACHERS */

function renderTeachers(){

    var search =
        document
        .getElementById("teacherSearch")
        .value
        .toLowerCase();


    var list =
        document.getElementById("teacherList");


    var filtered =
        teachers.filter(function(t){

            return (
                t.name + " " + t.subject
            )
            .toLowerCase()
            .includes(search);

        });


    if(!filtered.length){

        list.innerHTML =
            '<div class="mut">' +
            'Nenhum professor encontrado.' +
            '</div>';

        return;

    }


    list.innerHTML =
        filtered.map(function(t){

            var count =
                ratings.filter(function(r){

                    return r.teacher_id === t.id;

                }).length;


            return (

                '<div class="item">' +

                '<strong>' +
                esc(t.name) +
                '</strong>' +

                '<div class="mut">' +
                esc(t.subject) +
                ' · ' +
                count +
                ' avaliação(ões)' +
                '</div>' +

                '<div class="actions">' +

                '<button onclick="editTeacher(' +
                t.id +
                ')">' +
                'Editar' +
                '</button>' +

                '<button class="delete" onclick="deleteTeacher(' +
                t.id +
                ')">' +
                'Apagar' +
                '</button>' +

                '</div>' +

                '</div>'

            );

        }).join("");

}


/* EDIT TEACHER */

function editTeacher(id){

    var teacher =
        teachers.find(function(t){

            return t.id === id;

        });


    if(!teacher)
        return;


    var name =
        prompt(
            "Nome do professor:",
            teacher.name
        );


    if(name === null)
        return;


    var subject =
        prompt(
            "Disciplina / função:",
            teacher.subject
        );


    if(subject === null)
        return;


    name = name.trim();

    subject = subject.trim();


    if(!name || !subject){

        alert("Preenche todos os campos.");

        return;

    }


    sb
        .from("teachers")
        .update({

            name:name,
            subject:subject

        })
        .eq("id",id)
        .then(function(result){

            if(result.error){

                console.error(result.error);

                alert("Erro ao editar professor.");

                return;

            }


            loadData();

        });

}


/* DELETE TEACHER */

function deleteTeacher(id){

    var teacher =
        teachers.find(function(t){

            return t.id === id;

        });


    if(!teacher)
        return;


    var ok =
        confirm(
            "Apagar o professor \"" +
            teacher.name +
            "\" e todas as suas avaliações?"
        );


    if(!ok)
        return;


    sb
        .from("ratings")
        .delete()
        .eq("teacher_id",id)
        .then(function(result){

            if(result.error){

                console.error(result.error);

                alert(
                    "Erro ao apagar avaliações."
                );

                return;

            }


            sb
                .from("teachers")
                .delete()
                .eq("id",id)
                .then(function(result2){

                    if(result2.error){

                        console.error(
                            result2.error
                        );

                        alert(
                            "Erro ao apagar professor."
                        );

                        return;

                    }


                    loadData();

                });

        });

}


/* ADD TEACHER */

function addTeacher(){

    var name =
        document
        .getElementById("newTeacherName")
        .value
        .trim();


    var subject =
        document
        .getElementById("newTeacherSubject")
        .value
        .trim();


    var message =
        document.getElementById("addMessage");


    if(!name || !subject){

        message.textContent =
            "Preenche o nome e a disciplina.";

        return;

    }


    sb
        .from("teachers")
        .insert({

            name:name,
            subject:subject

        })
        .then(function(result){

            if(result.error){

                console.error(result.error);

                message.textContent =
                    "Erro ao adicionar professor.";

                return;

            }


            document
                .getElementById("newTeacherName")
                .value = "";


            document
                .getElementById("newTeacherSubject")
                .value = "";


            message.textContent =
                "Professor adicionado.";


            loadData();

        });

}


/* RATINGS */

function renderRatings(){

    var search =
        document
        .getElementById("ratingSearch")
        .value
        .toLowerCase();


    var list =
        document.getElementById("ratingList");


    var filtered =
        ratings.filter(function(r){

            var teacher =
                teachers.find(function(t){

                    return t.id === r.teacher_id;

                });


            var teacherName =
                teacher ? teacher.name : "";


            var text =
                teacherName +
                " " +
                (r.comment || "");


            return text
                .toLowerCase()
                .includes(search);

        });


    if(!filtered.length){

        list.innerHTML =
            '<div class="mut">' +
            'Nenhuma avaliação encontrada.' +
            '</div>';

        return;

    }


    list.innerHTML =
        filtered.map(function(r){

            var teacher =
                teachers.find(function(t){

                    return t.id === r.teacher_id;

                });


            var teacherName =
                teacher
                ? teacher.name
                : "Professor desconhecido";


            return (

                '<div class="rating">' +

                '<strong>' +
                esc(teacherName) +
                '</strong>' +

                '<div class="mut">' +
                'Avaliação #' +
                r.id +
                '</div>' +

                '<p>' +
                'Clareza: ' +
                r.clareza +
                '/5<br>' +

                'Apoio: ' +
                r.apoio +
                '/5<br>' +

                'Justiça: ' +
                r.justica +
                '/5' +

                '</p>' +

                '<textarea id="comment-' +
                r.id +
                '" rows="3">' +
                esc(r.comment || "") +
                '</textarea>' +

                '<div class="actions">' +

                '<button onclick="saveRating(' +
                r.id +
                ')">' +
                'Guardar edição' +
                '</button>' +

                '<button class="delete" onclick="deleteRating(' +
                r.id +
                ')">' +
                'Apagar' +
                '</button>' +

                '</div>' +

                '</div>'

            );

        }).join("");

}


/* EDIT RATING */

function saveRating(id){

    var rating =
        ratings.find(function(r){

            return r.id === id;

        });


    if(!rating)
        return;


    var clareza =
        prompt(
            "Clareza (1-5):",
            rating.clareza
        );


    if(clareza === null)
        return;


    var apoio =
        prompt(
            "Apoio (1-5):",
            rating.apoio
        );


    if(apoio === null)
        return;


    var justica =
        prompt(
            "Justiça (1-5):",
            rating.justica
        );


    if(justica === null)
        return;


    clareza = Number(clareza);
    apoio = Number(apoio);
    justica = Number(justica);


    if(
        clareza < 1 || clareza > 5 ||
        apoio < 1 || apoio > 5 ||
        justica < 1 || justica > 5
    ){

        alert("As notas devem estar entre 1 e 5.");

        return;

    }


    var comment =
        document
        .getElementById("comment-"+id)
        .value
        .trim();


    sb
        .from("ratings")
        .update({

            clareza:clareza,
            apoio:apoio,
            justica:justica,
            comment:comment

        })
        .eq("id",id)
        .then(function(result){

            if(result.error){

                console.error(result.error);

                alert("Erro ao editar avaliação.");

                return;

            }


            loadData();

        });

}


/* DELETE RATING */

function deleteRating(id){

    if(
        !confirm(
            "Tens a certeza que queres apagar esta avaliação?"
        )
    ){

        return;

    }


    sb
        .from("ratings")
        .delete()
        .eq("id",id)
        .then(function(result){

            if(result.error){

                console.error(result.error);

                alert("Erro ao apagar avaliação.");

                return;

            }


            loadData();

        });

}

</script>

</body>
</html>
