<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A minha conta: perfil, avaliações feitas e publicações no fórum da plataforma ECL.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<title>A minha conta – Escola Comércio Lisboa</title>

<link rel="stylesheet" href="style.css">

<style>
.wrap{
max-width:760px;
}

.mrow{
border-top:1px solid var(--bd);
  padding:14px 0;
}

.mrow:first-of-type{
border-top:0;
  padding-top:0;
}

.mrow .meta{
font-size:12px;
  color:var(--mut);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.mrow .cmt{
white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin:6px 0;
}

.escores{
display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin:8px 0 10px;
}

.escores label{
display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  color:var(--mut);
  font-weight:700;
}

.escores input{
width:56px;
  padding:7px 8px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
</style>
</head>

<body>
<a class="skip" href="#main">Saltar para o conteúdo</a>

<div class="top">
  <b>Escola Comércio Lisboa</b>
  <span class="sub">· Avaliação de professores</span>
  <nav>
    <a href="index.html">Professores</a>
    <a href="top.html">Top</a>
    <a href="forum.html">Fórum</a>
    <span id="acct" class="acct"></span>
  </nav>
</div>

<div class="wrap" id="main">

  <div id="cfgWarn" class="warn hide">
    A base de dados ainda não está configurada.
  </div>

  <h1>A minha conta</h1>

  <div class="card">

    <h2>Sessão</h2>

    <p style="margin:0 0 8px">
      <b id="cName">…</b> <span id="cBadge"></span>
    </p>

    <div class="mut" id="cSince"></div>

    <div style="margin-top:12px">
      <button id="cOut">Terminar sessão</button>
    </div>

  </div>

  <div class="card">

    <h2>As minhas avaliações</h2>

    <div id="myList">
      <div class="mut">A carregar…</div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>

<script src="app.js"></script>

<script>

(function(){

var $ = ECL.$;
var esc = ECL.esc;
var fmtDate = ECL.fmtDate;
var starsHtml = ECL.starsHtml;
var badgeHtml = ECL.badgeHtml;
var configured = ECL.configured;
var sb = ECL.sb;
var getSession = ECL.getSession;
var endSession = ECL.endSession;

var mine = [];
var teachers = [];
var editing = 0;

var sess = getSession();

if(!sess){
  location.replace("auth.html?next=conta.html");
  return;
}

ECL.paintAcct("conta.html");

function teacherById(id){

  return teachers.find(function(t){
    return Number(t.id) === Number(id);
  });

}

function paintHead(){

  $("cName").textContent = sess.username;
  $("cBadge").innerHTML = badgeHtml(sess.role);
  $("cSince").textContent =
    "Membro desde " + fmtDate(sess.created_at);

}

function rowHtml(r){

  var t = teacherById(r.teacher_id);

  var name = t
    ? '<a href="teacher.html?id=' + t.id + '">' + esc(t.name) + '</a>'
    : "Professor removido";

  if(editing === Number(r.id)){

    return '<div class="mrow" data-row="' + r.id + '">' +

      '<div class="meta">' + name + '</div>' +

      '<div class="escores">' +
        '<label>Clareza ' +
          '<input type="number" min="1" max="5" step="1" ' +
            'value="' + Number(r.clareza) + '" ' +
            'data-rid="' + r.id + '" data-sc="c">' +
        '</label>' +
        '<label>Apoio ' +
          '<input type="number" min="1" max="5" step="1" ' +
            'value="' + Number(r.apoio) + '" ' +
            'data-rid="' + r.id + '" data-sc="a">' +
        '</label>' +
        '<label>Justiça ' +
          '<input type="number" min="1" max="5" step="1" ' +
            'value="' + Number(r.justica) + '" ' +
            'data-rid="' + r.id + '" data-sc="j">' +
        '</label>' +
      '</div>' +

      '<textarea data-edit="' + r.id + '" rows="3" maxlength="1000">' +
        esc(r.comment || "") +
      '</textarea>' +

      '<div class="counter">' +
        '<span data-len="' + r.id + '">' +
          (r.comment || "").length +
        '</span>/1000' +
      '</div>' +

      '<button data-save="' + r.id + '">Guardar</button>' +
      '<button class="abtn" data-cancel="' + r.id + '">Cancelar</button>' +
      '<span class="msg" data-msg="' + r.id + '"></span>' +

    '</div>';

  }

  var avg = (Number(r.clareza) + Number(r.apoio) + Number(r.justica)) / 3;

  return '<div class="mrow" data-row="' + r.id + '">' +

    '<div class="meta">' +
      name +
      ' · ' +
      '<span class="stars">' + starsHtml(avg) + '</span> ' +
      avg.toFixed(1) +
      ' · ' +
      'Clareza ' + r.clareza +
      ' · Apoio ' + r.apoio +
      ' · Justiça ' + r.justica +
      ' · ' +
      fmtDate(r.created_at) +
    '</div>' +

    (
      r.comment
      ? '<div class="cmt">' + esc(r.comment) + '</div>'
      : '<div class="mut" style="margin:6px 0">Sem comentário.</div>'
    ) +

    '<button class="abtn" data-edit-btn="' + r.id + '">Editar</button>' +

  '</div>';

}

function renderList(){

  if(!mine.length){

    $("myList").innerHTML =
      '<div class="mut">' +
      'Ainda não tens avaliações. ' +
      '<a href="index.html">Avalia um professor</a>!' +
      '</div>';

    return;

  }

  $("myList").innerHTML = mine.map(rowHtml).join("");

}

function loadMine(){

  if(!configured)
    return;

  sb.rpc("my_ratings",{ p_token:sess.token }).then(function(r){

    if(r.error){

      console.error(r.error);

      var em = r.error.message || "Erro ao carregar.";

      if(/sess.o/i.test(em)){
        endSession();
        location.replace("auth.html?next=conta.html");
        return;
      }

      $("myList").innerHTML =
        '<div class="mut">' + esc(em) + '</div>';

      return;

    }

    mine = r.data || [];

    renderList();

  });

}

$("myList").addEventListener("input", function(e){

  var ta = e.target.closest("[data-edit]");

  if(!ta)
    return;

  var len = document.querySelector(
    '[data-len="' + ta.getAttribute("data-edit") + '"]'
  );

  if(len)
    len.textContent = ta.value.length;

});

$("myList").addEventListener("click", function(e){

  var ed = e.target.closest("[data-edit-btn]");

  if(ed){
    editing = Number(ed.getAttribute("data-edit-btn"));
    renderList();
    return;
  }

  var ca = e.target.closest("[data-cancel]");

  if(ca){
    editing = 0;
    renderList();
    return;
  }

  var sv = e.target.closest("[data-save]");

  if(sv){

    var id = Number(sv.getAttribute("data-save"));

    var ta = document.querySelector('[data-edit="' + id + '"]');
    var me = document.querySelector('[data-msg="' + id + '"]');

    if(!ta || !me)
      return;

    var text = ta.value.trim();

    if(text.length > 1000){
      me.textContent = "O comentário pode ter no máximo 1000 caracteres.";
      return;
    }

    var ci = document.querySelector('[data-rid="' + id + '"][data-sc="c"]');
    var ai = document.querySelector('[data-rid="' + id + '"][data-sc="a"]');
    var ji = document.querySelector('[data-rid="' + id + '"][data-sc="j"]');

    if(!ci || !ai || !ji)
      return;

    var nc = Number(ci.value);
    var na = Number(ai.value);
    var nj = Number(ji.value);

    function badScore(v){
      return !Number.isInteger(v) || v < 1 || v > 5;
    }

    if(badScore(nc) || badScore(na) || badScore(nj)){
      me.textContent = "As três notas devem ser valores inteiros entre 1 e 5.";
      return;
    }

    var r = mine.find(function(x){
      return Number(x.id) === id;
    });

    if(!r)
      return;

    sv.disabled = true;
    me.textContent = "";

    sb.rpc("rating_update",{
      p_token:sess.token,
      p_id:id,
      p_clareza:nc,
      p_apoio:na,
      p_justica:nj,
      p_comment:text
    }).then(function(res){

      sv.disabled = false;

      if(res.error){

        console.error(res.error);

        var em = res.error.message || "Erro ao guardar.";

        if(/sess.o/i.test(em)){
          endSession();
          location.replace("auth.html?next=conta.html");
          return;

        }

        me.textContent = em;
        return;

      }

      r.clareza = nc;
      r.apoio = na;
      r.justica = nj;
      r.comment = text || null;

      editing = 0;

      renderList();

      ECL.toast("Avaliação atualizada.");

    });

  }

});

$("cOut").onclick = function(){

  if(sb)
    sb.rpc("logout",{ p_token:sess.token });

  endSession();

  location.replace("index.html");

};

paintHead();

if(configured && sb){

  sb
    .from("teachers")
    .select("*")
    .order("name")
      .then(function(res){

      if(!res.error)
        teachers = res.data || [];

      loadMine();

    }).catch(function(){
      loadMine();
    });

}else{

  $("myList").innerHTML =
    '<div class="mut">Configure a base de dados.</div>';

}

})();

</script>

</body>
</html>
