<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://flagcdn.com; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lista de professores da Escola Comércio de Lisboa com notas, comentários e avaliações dos alunos.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<title>Avaliação de Professores – Escola Comércio Lisboa</title>

<link rel="stylesheet" href="style.css">

<style>
.toolbar{
display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.toolbar input{
margin-bottom:0;
  flex:1;
}

.toolbar select{
margin-bottom:0;
  width:auto;
  min-width:150px;
}

@media (max-width:560px){
  .toolbar input{
  flex:1 1 100%;
  }

  .toolbar select{
  flex:1 1 auto;
    min-width:0;
  }
}

.grid{
display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:12px;
}

.tcard{
display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:0;
  text-decoration:none;
  color:inherit;
  transition:box-shadow .12s ease,border-color .12s ease;
}

.tcard:hover{
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  border-color:#bdbdb8;
}

.avatar{
flex:0 0 auto;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--ac-soft);
  color:var(--ac);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:15px;
}

.tinfo{
flex:1;
  min-width:0;
}

.tname{
font-weight:700;
}

.avg{
font-size:17px;
  font-weight:700;
  white-space:nowrap;
  color:var(--tx);
}

.bars{
margin-top:8px;
  display:grid;
  gap:5px;
}

.bar{
display:grid;
  grid-template-columns:58px 1fr 24px;
  gap:8px;
  align-items:center;
  font-size:12px;
  color:var(--mut);
}

.track{
height:6px;
  background:var(--track);
  border-radius:3px;
  overflow:hidden;
}

.fill{
display:block;
  height:100%;
  background:var(--star);
  border-radius:3px;
}

.bar b{
text-align:right;
  color:var(--tx);
  font-weight:600;
}

.clr{
background:none;
  border:0;
  color:var(--ac);
  padding:0;
  margin-left:6px;
  font-size:13px;
  font-weight:600;
  text-decoration:underline;
  border-radius:0;
}

.clr:hover{
background:none;
  color:var(--ac-hov);
  opacity:1;
}

.rcount{
margin-top:18px;
  font-size:13px;
  color:var(--mut);
}

</style>
</head>

<body>
<a class="skip" href="#main">Saltar para o conteúdo</a>

<div class="top">
  <b>Escola Comércio Lisboa</b>
  <span class="sub">· Avaliação de professores</span>
  <nav>
    <a href="index.html" class="on">Professores</a>
    <a href="top.html">Top</a>
    <a href="forum.html">Fórum</a>
    <span id="acct" class="acct"></span>
  </nav>
</div>

<div class="wrap" id="main">

  <h1>Escolha um professor</h1>

  <div id="cfgWarn" class="warn hide">
    A base de dados ainda não está configurada.
  </div>

  <div id="truncWarn" class="warn hide">
    A mostrar os dados mais recentes (limite de 1000 por tabela).
  </div>

  <div class="toolbar">
    <input
      id="q"
      placeholder="Pesquisar professor ou função"
      aria-label="Pesquisar professor ou função"
      autocomplete="off"
    >
    <select id="fn" aria-label="Filtrar por função">
      <option value="">Todas as funções</option>
    </select>
    <select id="sort" aria-label="Ordenar">
      <option value="name">Nome (A-Z)</option>
      <option value="rating">Melhor média</option>
      <option value="count">Mais avaliações</option>
    </select>
  </div>

  <div id="rcount" class="rcount" aria-live="polite"></div>

  <div id="list" class="grid" style="margin-top:8px">
    <div class="card" style="grid-column:1/-1">
      <div class="sk sk-line" style="width:55%"></div>
      <div class="sk sk-line" style="width:35%;margin-top:10px"></div>
      <div class="sk sk-line" style="width:80%;margin-top:10px"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>

<script src="app.js"></script>

<script>

(function(){

var $ = ECL.$;
var esc = ECL.esc;
var configured = ECL.configured;
var sb = ECL.sb;

var teachers = [];
var ratings = [];

ECL.paintAcct();

function avg(list,k){

  if(!list.length)
    return 0;

  return list.reduce(function(a,x){

    return a + Number(x[k]);

  },0) / list.length;

}

function totals(r){

  var c = avg(r,"clareza");
  var a = avg(r,"apoio");
  var j = avg(r,"justica");

  return {
    c:c,
    a:a,
    j:j,
    t:(c + a + j) / 3
  };

}

function initials(name){

  var parts = String(name).trim().split(/\s+/);

  var out = (parts[0] || "").charAt(0);

  if(parts.length > 1){
    out += parts[parts.length - 1].charAt(0);
  }

  return out.toUpperCase();
}

function bar(label,v){

  return '<div class="bar">' +
    '<span>' + label + '</span>' +
    '<span class="track">' +
      '<span class="fill" style="width:' +
      Math.round((v / 5) * 100) +
      '%"></span>' +
    '</span>' +
    '<b>' +
    (v ? v.toFixed(1) : "—") +
    '</b>' +
    '</div>';

}

function norm(s){

  s = String(s).toLowerCase();

  return s.normalize
    ? s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    : s;

}

function render(){

  var q = norm($("q").value);
  var fn = $("fn").value;
  var sort = $("sort").value;

  var rows = teachers.filter(function(t){

    if(fn && t.subject !== fn)
      return false;

    return norm(t.name + " " + t.subject).indexOf(q) >= 0;

  }).map(function(t){

    var r = ratings.filter(function(x){

      return Number(x.teacher_id) === Number(t.id);

    });

    return {
      t:t,
      r:r,
      n:r.length,
      v:totals(r)
    };

  });

  rows.sort(function(a,b){

    if(sort === "rating"){
      return b.v.t - a.v.t || a.t.name.localeCompare(b.t.name);
    }

    if(sort === "count"){
      return b.n - a.n || a.t.name.localeCompare(b.t.name);
    }

    return a.t.name.localeCompare(b.t.name);

  });

  var total = teachers.length;
  var filtered = !!q || !!fn;

  $("rcount").textContent = filtered
    ? rows.length + " de " + total + " professores"
    : total + (total === 1 ? " professor" : " professores");

  if(!rows.length){

    $("list").innerHTML =
      '<div class="card mut" style="grid-column:1/-1">' +
      (teachers.length
        ? "Nenhum professor corresponde à pesquisa." +
          '<button id="clr" class="clr" type="button">limpar pesquisa</button>'
        : "Ainda não há professores.") +
      '</div>';

    var clr = $("clr");

    if(clr){
      clr.onclick = function(){
        $("q").value = "";
        $("fn").value = "";
        render();
      };
    }

    return;

  }

  $("list").innerHTML = rows.map(function(x){

    return '<a class="card tcard" href="teacher.html?id=' +
      x.t.id +
      '">' +

      '<div class="avatar">' +
      esc(initials(x.t.name)) +
      '</div>' +

      '<div class="tinfo">' +

      '<div class="tname">' +
      esc(x.t.name) +
      '</div>' +

      '<div class="mut">' +
      esc(x.t.subject) +
      ' · ' +
      x.n +
      ' avaliaç' +
      (x.n === 1 ? 'ão' : 'ões') +
      '</div>' +

      (
        x.n
        ?
        '<div class="bars">' +
          bar("Clareza",x.v.c) +
          bar("Apoio",x.v.a) +
          bar("Justiça",x.v.j) +
        '</div>'
        :
        '<div class="mut" style="margin-top:6px">Sem avaliações</div>'
      ) +

      '</div>' +

      '<div class="avg">' +
      (x.n ? '<span class="stars">★</span> ' + x.v.t.toFixed(1) : "—") +
      '</div>' +

      '</a>';

  }).join("");

}

$("q").oninput = render;
$("fn").onchange = render;
$("sort").onchange = render;

function fillFn(){

  var prev = $("fn").value;
  var counts = {};

  teachers.forEach(function(t){
    counts[t.subject] = (counts[t.subject] || 0) + 1;
  });

  var keys = Object.keys(counts).sort(function(a,b){
    return counts[b] - counts[a] ||
      String(a).localeCompare(String(b),"pt");
  });

  var sel = $("fn");

  sel.innerHTML = "";

  var all = document.createElement("option");
  all.value = "";
  all.textContent = "Todas as funções";
  sel.appendChild(all);

  keys.forEach(function(k){
    var o = document.createElement("option");
    o.value = k;
    o.textContent = k + " (" + counts[k] + ")";
    sel.appendChild(o);
  });

  sel.value = prev;

}

function loadAll(){

  if(!configured){

    $("list").innerHTML =
      '<div class="card mut" style="grid-column:1/-1">' +
      'Configure a base de dados para ver e enviar avaliações partilhadas.' +
      '</div>';

    return;
  }

  ECL.cached("d-index", 300000, function(){
    return Promise.all([

      sb
        .from("teachers")
        .select("*")
        .order("name")
        .limit(1000),

      sb
        .from("ratings")
        .select("*")
        .order("id",{ascending:false})
        .limit(1000)

    ]).then(function(res){

      if(res[0].error || res[1].error)
        return Promise.reject(res[0].error || res[1].error);

      return {
        teachers: res[0].data || [],
        ratings: res[1].data || []
      };

    });
  }).then(function(d){

    teachers = d.teachers;
    ratings = d.ratings;

    $("truncWarn").classList.toggle(
      "hide",
      teachers.length < 1000 && ratings.length < 1000
    );

    fillFn();
    render();

  }).catch(function(){

    $("list").innerHTML =
      '<div class="card mut" style="grid-column:1/-1">' +
      'Erro a carregar dados.' +
      '</div>';

  });

}

loadAll();

if(configured){

  sb
    .channel("public:changes-index")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"ratings"
      },
      loadAll
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"teachers"
      },
      loadAll
    )

    .subscribe();

}

})();

</script>

</body>
</html>
