<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Top Professores – Escola Comércio Lisboa</title>

<link rel="stylesheet" href="style.css">

<style>
.top nav{
margin-left:auto;
  display:flex;
  gap:4px;
  align-items:center;
}

.top a,
.top .acct a{
color:var(--tx);
  text-decoration:none;
  font-weight:600;
  padding:7px 14px;
  border-radius:999px;
  transition:background .15s ease,color .15s ease;
}

.top a:hover,
.top .acct a:hover{
background:var(--ac-soft);
  color:var(--ac);
  text-decoration:none;
}

.top a.on{
background:var(--ac);
  color:#fff;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .top a.on{
  color:#111;
  }
}

:root[data-theme="dark"] .top a.on{
color:#111;
}

.acct{
font-weight:400;
}

.badge{
display:inline-block;
  padding:1px 7px;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  vertical-align:middle;
}

.b-owner{
background:#f0b429;color:#3d2c00
}

.b-admin{
background:#1f3a68;color:#fff
}

.b-moderator{
background:#1f7a4d;color:#fff
}

.b-user{
background:var(--ac-soft);color:var(--ac)
}

.wrap{
max-width:760px;
  margin:0 auto;
  padding:16px 16px 40px;
}

.intro{
margin:0 0 4px;
  color:var(--mut);
}

a{
color:var(--ac);
}

.card{
background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  padding:18px;
  margin-top:14px;
}

.warn{
background:#fff3cd;
  color:#7a5b00;
  border:1px solid #f0d67a;
  padding:10px 12px;
  font-size:13px;
  border-radius:12px;
  margin-top:12px;
}

.sortrow{
display:flex;
  gap:8px;
  align-items:center;
  margin:14px 0 0;
  flex-wrap:wrap;
}

.sortbtn{
background:var(--card);
  color:var(--mut);
  border:1px solid var(--bd);
  padding:7px 16px;
  font-size:13px;
  font-weight:700;
  box-shadow:none;
}

.sortbtn:hover{
opacity:1;
  transform:none;
  box-shadow:none;
  color:var(--ac);
  border-color:var(--ac);
}

.sortbtn.on{
background:var(--ac);
  color:#fff;
  border-color:transparent;
}

.sortbtn.on:hover{
  background:var(--ac-hov);
  color:#fff;
}

.trow{
display:flex;
  gap:14px;
  align-items:center;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  padding:14px 16px;
  margin-top:12px;
  text-decoration:none;
  color:inherit;
  transition:box-shadow .15s ease;
}

.trow:hover{
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  text-decoration:none;
  color:inherit;
}

.rank{
flex:0 0 auto;
  width:40px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  color:var(--mut);
}

.rank.r1{
color:#c98a00
}

.rank.r2{
color:#8a8f98
}

.rank.r3{
color:#b06a3b
}

.avatar{
flex:0 0 auto;
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--ac-soft);
  color:var(--ac);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:16px;
}

.tinfo{
flex:1;
  min-width:0;
}

.tinfo .nm{
font-weight:700;
  font-size:15px;
}

.tstat{
flex:0 0 auto;
  text-align:right;
}

.tstat .num{
font-size:22px;
  font-weight:700;
  color:var(--ac);
}

.stars{
color:var(--star);
  letter-spacing:1px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="top">
  <b>Escola Comércio Lisboa</b>
  <span class="sub">· Avaliação de professores</span>
  <nav>
    <a href="index.html">Professores</a>
    <a href="top.html" class="on">Top</a>
    <a href="forum.html">Fórum</a>
    <span id="acct" class="acct"></span>
  </nav>
</div>

<div class="wrap">

  <div id="cfgWarn" class="warn hide">
    A base de dados ainda não está configurada.
  </div>

  <h1>Top Professores</h1>

  <p class="intro">
    Ranking pela média das avaliações dos alunos.
  </p>

  <div class="sortrow">
    <button id="sortAvg" class="sortbtn on">Melhores</button>
    <button id="sortCount" class="sortbtn">Mais avaliados</button>
  </div>

  <div id="list">
    <div class="mut" style="margin-top:14px">A carregar…</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>

<script>

var SUPABASE_URL =
"https://qsnncbwoybwkhwyepaai.supabase.co";

var SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbm5jYndveWJ3a2h3eWVwYWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjUxMjEsImV4cCI6MjEwNjI0MTEyMX0.RWSTvm_FuJq7FDPiYErHgsTOHPmktgnEG2eKMtNc5TE";

(function(){

var $ = function(i){
  return document.getElementById(i);
};

var teachers = [];
var ratings = [];
var loaded = false;
var sortMode = "avg";

var configured =
  SUPABASE_URL.indexOf("http") === 0 &&
  SUPABASE_KEY.length > 20;

var sb = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    )
  : null;

if(!configured){
  $("cfgWarn").classList.remove("hide");
}

function esc(s){

  var d = document.createElement("div");

  d.textContent = s == null ? "" : s;

  return d.innerHTML;

}

var SKEY = "ecl-session";

function getSession(){

  try{
    var s = JSON.parse(localStorage.getItem(SKEY));
    if(s && s.token && Number(s.exp) * 1000 > Date.now())
      return s;
  }catch(e){}

  return null;

}

function endSession(){
  localStorage.removeItem(SKEY);
}

function doLogout(){

  var s = getSession();

  if(s && sb){
    sb.rpc("logout",{ p_token:s.token });
  }

  endSession();

  paintAcct();

}

function paintAcct(){

  var el = $("acct");
  var s = getSession();

  if(s){

    el.innerHTML =
      'Olá, <a href="conta.html"><b>' + esc(s.username) + '</b></a> · ' +
      '<a href="#" id="acctOut">Sair</a>';

    $("acctOut").onclick = function(e){
      e.preventDefault();
      doLogout();
    };

  }else{

    el.innerHTML = '<a href="auth.html?next=top.html">Entrar</a>';

  }

}

paintAcct();

function avg(list,k){

  if(!list.length)
    return 0;

  return list.reduce(function(a,x){
    return a + Number(x[k]);
  },0) / list.length;

}

function initials(name){

  var parts = String(name).trim().split(/\s+/);

  var out = (parts[0] || "").charAt(0);

  if(parts.length > 1){
    out += parts[parts.length - 1].charAt(0);
  }

  return out.toUpperCase();

}

function starsHtml(t){

  var full = Math.round(t);

  return "★★★★★".slice(0,full) + "☆☆☆☆☆".slice(0,5-full);

}

function render(){

  if(!configured){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">' +
      'Configure a base de dados para ver o ranking.' +
      '</div>';

    return;
  }

  if(!loaded){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">A carregar…</div>';

    return;
  }

  var rows = teachers.map(function(t){

    var r = ratings.filter(function(x){
      return Number(x.teacher_id) === Number(t.id);
    });

    var c = avg(r,"clareza");
    var a = avg(r,"apoio");
    var j = avg(r,"justica");
    var m = r.length ? (c + a + j) / 3 : 0;

    return { t:t, n:r.length, m:m };

  }).filter(function(x){
    return x.n > 0;
  });

  if(sortMode === "count"){
    rows.sort(function(a,b){
      return b.n - a.n || b.m - a.m;
    });
  }else{
    rows.sort(function(a,b){
      return b.m - a.m || b.n - a.n;
    });
  }

  if(!rows.length){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">' +
      'Ainda não há avaliações. Seja o primeiro a avaliar!' +
      '</div>';

    return;

  }

  $("list").innerHTML = rows.map(function(x,i){

    return '<a class="trow" href="teacher.html?id=' + x.t.id + '">' +

      '<div class="rank' + (i < 3 ? " r" + (i + 1) : "") + '">' +
        '#' + (i + 1) +
      '</div>' +

      '<div class="avatar">' +
        esc(initials(x.t.name)) +
      '</div>' +

      '<div class="tinfo">' +
        '<div class="nm">' + esc(x.t.name) + '</div>' +
        '<div class="mut">' + esc(x.t.subject) + '</div>' +
      '</div>' +

      '<div class="tstat">' +
        '<div class="num">' + x.m.toFixed(1) + '</div>' +
        '<div class="stars">' + starsHtml(x.m) + '</div>' +
        '<div class="mut">' + x.n + ' avaliação' + (x.n === 1 ? "" : "ões") + '</div>' +
      '</div>' +

    '</a>';

  }).join("");

}

function loadAll(){

  if(!configured)
    return;

  Promise.all([

    sb
      .from("teachers")
      .select("*")
      .order("name"),

    sb
      .from("ratings")
      .select("*")

  ]).then(function(res){

    if(res[0].error || res[1].error){

      console.error(res[0].error);
      console.error(res[1].error);

      $("list").innerHTML =
        '<div class="mut" style="margin-top:14px">Erro a carregar dados.</div>';

      return;

    }

    teachers = res[0].data || [];
    ratings = res[1].data || [];
    loaded = true;

    render();

  });

}

$("sortAvg").onclick = function(){
  sortMode = "avg";
  $("sortAvg").classList.add("on");
  $("sortCount").classList.remove("on");
  render();
};

$("sortCount").onclick = function(){
  sortMode = "count";
  $("sortCount").classList.add("on");
  $("sortAvg").classList.remove("on");
  render();
};

loadAll();

render();

})();

</script>

</body>
</html>
