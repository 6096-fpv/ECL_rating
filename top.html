<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Top Professores – Escola Comércio Lisboa</title>

<style>
:root{
  color-scheme:light;
  --bg:#f1f1ef;
  --card:#fff;
  --tx:#222;
  --mut:#6b6b6b;
  --ac:#1f3a68;
  --ac-soft:#e7ecf5;
  --bd:#d4d4d0;
  --star:#c98a00;
  --track:#e6e6e2;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0f14;
    --card:rgba(255,255,255,.06);
    --tx:#e8ecf4;
    --mut:#9aa3b2;
    --ac:#8fb0e8;
    --ac-soft:rgba(143,176,232,.16);
    --bd:rgba(255,255,255,.12);
    --star:#e0a526;
    --track:rgba(255,255,255,.08);
  }
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0f14;
  --card:rgba(255,255,255,.06);
  --tx:#e8ecf4;
  --mut:#9aa3b2;
  --ac:#8fb0e8;
  --ac-soft:rgba(143,176,232,.16);
  --bd:rgba(255,255,255,.12);
  --star:#e0a526;
  --track:rgba(255,255,255,.08);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::before,
  :root:not([data-theme="light"]) body::after{
    content:"";
    position:fixed;
    z-index:-1;
    border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    pointer-events:none;
  }
  :root:not([data-theme="light"]) body::before{
    width:540px;
    height:540px;
    top:-150px;
    right:-130px;
    background:radial-gradient(circle,#2a4a8f 0%,transparent 70%);
  }
  :root:not([data-theme="light"]) body::after{
    width:500px;
    height:500px;
    bottom:-170px;
    left:-150px;
    background:radial-gradient(circle,#5b3a8f 0%,transparent 70%);
  }
}

:root[data-theme="dark"] body::before,
:root[data-theme="dark"] body::after{
  content:"";
  position:fixed;
  z-index:-1;
  border-radius:50%;
  filter:blur(90px);
  opacity:.45;
  pointer-events:none;
}

:root[data-theme="dark"] body::before{
  width:540px;
  height:540px;
  top:-150px;
  right:-130px;
  background:radial-gradient(circle,#2a4a8f 0%,transparent 70%);
}

:root[data-theme="dark"] body::after{
  width:500px;
  height:500px;
  bottom:-170px;
  left:-150px;
  background:radial-gradient(circle,#5b3a8f 0%,transparent 70%);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15.5px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:10px 18px;
  font-size:14px;
  color:var(--tx);
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(16px) saturate(1.8);
  backdrop-filter:blur(16px) saturate(1.8);
  border-bottom:1px solid var(--bd);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .top{
    background:rgba(13,15,20,.65);
    border-bottom-color:rgba(255,255,255,.1);
  }
}

:root[data-theme="dark"] .top{
  background:rgba(13,15,20,.65);
  border-bottom-color:rgba(255,255,255,.1);
}

.top nav{
  margin-left:auto;
  display:flex;
  gap:4px;
  align-items:center;
}

.top b{
  font-weight:800;
  letter-spacing:-.2px;
}

.top .sub{
  color:var(--mut);
}

.top a,
.top .acct a{
  color:var(--tx);
  text-decoration:none;
  font-weight:600;
  padding:7px 14px;
  border-radius:999px;
  transition:background .15s ease,color .15s ease;
}

.top a:hover,
.top .acct a:hover{
  background:var(--ac-soft);
  color:var(--ac);
  text-decoration:none;
}

.top a.on{
  background:var(--ac);
  color:#fff;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .top a.on{
    color:#111;
  }
}

:root[data-theme="dark"] .top a.on{
  color:#111;
}

.acct{
  font-weight:400;
}

.badge{
  display:inline-block;
  padding:1px 7px;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  vertical-align:middle;
}

.b-owner{background:#f0b429;color:#3d2c00}
.b-admin{background:#1f3a68;color:#fff}
.b-moderator{background:#1f7a4d;color:#fff}
.b-user{background:var(--ac-soft);color:var(--ac)}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:16px 16px 40px;
}

h1{
  font-size:26px;
  margin:10px 0 6px;
  font-weight:800;
  letter-spacing:-.4px;
}

.intro{
  margin:0 0 4px;
  color:var(--mut);
}

a{
  color:var(--ac);
}

.card{
  background:var(--card);
  border:0;
  border-radius:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.07);
  padding:18px;
  margin-top:14px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card{
    border:1px solid var(--bd);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
  }
}

:root[data-theme="dark"] .card{
  border:1px solid var(--bd);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
}

h2{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--mut);
  margin:0 0 10px;
  font-weight:700;
}

button{
  font:inherit;
  font-weight:600;
  cursor:pointer;
  border:0;
  border-radius:999px;
  padding:10px 20px;
  background:linear-gradient(135deg,#1f3a68 0%,#3565a8 100%);
  color:#fff;
  box-shadow:0 1px 3px rgba(31,58,104,.35);
  transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;
}

button:hover{
  opacity:1;
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(31,58,104,.35);
}

.mut{
  color:var(--mut);
  font-size:13px;
}

.hide{
  display:none!important;
}

.warn{
  background:#fff3cd;
  color:#7a5b00;
  border:1px solid #f0d67a;
  padding:10px 12px;
  font-size:13px;
  border-radius:12px;
  margin-top:12px;
}

.sortrow{
  display:flex;
  gap:8px;
  align-items:center;
  margin:14px 0 0;
  flex-wrap:wrap;
}

.sortbtn{
  background:var(--card);
  color:var(--mut);
  border:1px solid var(--bd);
  padding:7px 16px;
  font-size:13px;
  font-weight:700;
  box-shadow:none;
}

.sortbtn:hover{
  opacity:1;
  transform:none;
  box-shadow:none;
  color:var(--ac);
  border-color:var(--ac);
}

.sortbtn.on{
  background:linear-gradient(135deg,#1f3a68 0%,#3565a8 100%);
  color:#fff;
  border-color:transparent;
  box-shadow:0 1px 3px rgba(31,58,104,.35);
}

.trow{
  display:flex;
  gap:14px;
  align-items:center;
  background:var(--card);
  border:0;
  border-radius:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.07);
  padding:14px 16px;
  margin-top:12px;
  text-decoration:none;
  color:inherit;
  transition:transform .15s ease,box-shadow .15s ease;
}

.trow:hover{
  transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,0,0,.1);
  text-decoration:none;
  color:inherit;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .trow{
    border:1px solid var(--bd);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
  }
}

:root[data-theme="dark"] .trow{
  border:1px solid var(--bd);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07);
}

.rank{
  flex:0 0 auto;
  width:40px;
  text-align:center;
  font-size:20px;
  font-weight:800;
  color:var(--mut);
}

.rank.r1{color:#c98a00}
.rank.r2{color:#8a8f98}
.rank.r3{color:#b06a3b}

.avatar{
  flex:0 0 auto;
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--ac-soft);
  color:var(--ac);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:16px;
}

.tinfo{
  flex:1;
  min-width:0;
}

.tinfo .nm{
  font-weight:700;
  font-size:15px;
}

.tstat{
  flex:0 0 auto;
  text-align:right;
}

.tstat .num{
  font-size:22px;
  font-weight:800;
  color:var(--ac);
}

.stars{
  color:var(--star);
  letter-spacing:1px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="top">
  <b>Escola Comércio Lisboa</b>
  <span class="sub">· Avaliação de professores</span>
  <nav>
    <a href="index.html">Professores</a>
    <a href="top.html" class="on">Top</a>
    <a href="forum.html">Fórum</a>
    <span id="acct" class="acct"></span>
  </nav>
</div>

<div class="wrap">

  <div id="cfgWarn" class="warn hide">
    A base de dados ainda não está configurada.
  </div>

  <h1>Top Professores</h1>

  <p class="intro">
    Ranking pela média das avaliações dos alunos.
  </p>

  <div class="sortrow">
    <button id="sortAvg" class="sortbtn on">Melhores</button>
    <button id="sortCount" class="sortbtn">Mais avaliados</button>
  </div>

  <div id="list">
    <div class="mut" style="margin-top:14px">A carregar…</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>

<script>

var SUPABASE_URL =
"https://qsnncbwoybwkhwyepaai.supabase.co";

var SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbm5jYndveWJ3a2h3eWVwYWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjUxMjEsImV4cCI6MjEwNjI0MTEyMX0.RWSTvm_FuJq7FDPiYErHgsTOHPmktgnEG2eKMtNc5TE";

(function(){

var $ = function(i){
  return document.getElementById(i);
};

var teachers = [];
var ratings = [];
var loaded = false;
var sortMode = "avg";

var configured =
  SUPABASE_URL.indexOf("http") === 0 &&
  SUPABASE_KEY.length > 20;

var sb = configured
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    )
  : null;

if(!configured){
  $("cfgWarn").classList.remove("hide");
}

function esc(s){

  var d = document.createElement("div");

  d.textContent = s == null ? "" : s;

  return d.innerHTML;

}

var SKEY = "ecl-session";

function getSession(){

  try{
    var s = JSON.parse(localStorage.getItem(SKEY));
    if(s && s.token && Number(s.exp) * 1000 > Date.now())
      return s;
  }catch(e){}

  return null;

}

function endSession(){
  localStorage.removeItem(SKEY);
}

function doLogout(){

  var s = getSession();

  if(s && sb){
    sb.rpc("logout",{ p_token:s.token });
  }

  endSession();

  paintAcct();

}

function paintAcct(){

  var el = $("acct");
  var s = getSession();

  if(s){

    el.innerHTML =
      'Olá, <a href="conta.html"><b>' + esc(s.username) + '</b></a> · ' +
      '<a href="#" id="acctOut">Sair</a>';

    $("acctOut").onclick = function(e){
      e.preventDefault();
      doLogout();
    };

  }else{

    el.innerHTML = '<a href="auth.html?next=top.html">Entrar</a>';

  }

}

paintAcct();

function avg(list,k){

  if(!list.length)
    return 0;

  return list.reduce(function(a,x){
    return a + Number(x[k]);
  },0) / list.length;

}

function initials(name){

  var parts = String(name).trim().split(/\s+/);

  var out = (parts[0] || "").charAt(0);

  if(parts.length > 1){
    out += parts[parts.length - 1].charAt(0);
  }

  return out.toUpperCase();

}

function starsHtml(t){

  var full = Math.round(t);

  return "★★★★★".slice(0,full) + "☆☆☆☆☆".slice(0,5-full);

}

function render(){

  if(!configured){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">' +
      'Configure a base de dados para ver o ranking.' +
      '</div>';

    return;
  }

  if(!loaded){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">A carregar…</div>';

    return;
  }

  var rows = teachers.map(function(t){

    var r = ratings.filter(function(x){
      return Number(x.teacher_id) === Number(t.id);
    });

    var c = avg(r,"clareza");
    var a = avg(r,"apoio");
    var j = avg(r,"justica");
    var m = r.length ? (c + a + j) / 3 : 0;

    return { t:t, n:r.length, m:m };

  }).filter(function(x){
    return x.n > 0;
  });

  if(sortMode === "count"){
    rows.sort(function(a,b){
      return b.n - a.n || b.m - a.m;
    });
  }else{
    rows.sort(function(a,b){
      return b.m - a.m || b.n - a.n;
    });
  }

  if(!rows.length){

    $("list").innerHTML =
      '<div class="mut" style="margin-top:14px">' +
      'Ainda não há avaliações. Seja o primeiro a avaliar!' +
      '</div>';

    return;

  }

  $("list").innerHTML = rows.map(function(x,i){

    return '<a class="trow" href="teacher.html?id=' + x.t.id + '">' +

      '<div class="rank' + (i < 3 ? " r" + (i + 1) : "") + '">' +
        '#' + (i + 1) +
      '</div>' +

      '<div class="avatar">' +
        esc(initials(x.t.name)) +
      '</div>' +

      '<div class="tinfo">' +
        '<div class="nm">' + esc(x.t.name) + '</div>' +
        '<div class="mut">' + esc(x.t.subject) + '</div>' +
      '</div>' +

      '<div class="tstat">' +
        '<div class="num">' + x.m.toFixed(1) + '</div>' +
        '<div class="stars">' + starsHtml(x.m) + '</div>' +
        '<div class="mut">' + x.n + ' avaliação' + (x.n === 1 ? "" : "ões") + '</div>' +
      '</div>' +

    '</a>';

  }).join("");

}

function loadAll(){

  if(!configured)
    return;

  Promise.all([

    sb
      .from("teachers")
      .select("*")
      .order("name"),

    sb
      .from("ratings")
      .select("*")

  ]).then(function(res){

    if(res[0].error || res[1].error){

      console.error(res[0].error);
      console.error(res[1].error);

      $("list").innerHTML =
        '<div class="mut" style="margin-top:14px">Erro a carregar dados.</div>';

      return;

    }

    teachers = res[0].data || [];
    ratings = res[1].data || [];
    loaded = true;

    render();

  });

}

$("sortAvg").onclick = function(){
  sortMode = "avg";
  $("sortAvg").classList.add("on");
  $("sortCount").classList.remove("on");
  render();
};

$("sortCount").onclick = function(){
  sortMode = "count";
  $("sortCount").classList.add("on");
  $("sortAvg").classList.remove("on");
  render();
};

loadAll();

render();

})();

</script>

</body>
</html>
