<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ranking dos professores da Escola Comércio de Lisboa: mais avaliados e melhores notas.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<title>Top Professores – Escola Comércio Lisboa</title>

<link rel="stylesheet" href="style.css">

<style>
.wrap{
max-width:760px;
}

.sortrow{
display:flex;
  gap:8px;
  align-items:center;
  margin:14px 0 0;
  flex-wrap:wrap;
}

/* secondary criterion tabs (underline, not pills) */
.ctabs{
display:flex;
  gap:16px;
  margin-top:16px;
  border-bottom:1px solid var(--bd);
}

.ctab{
background:none;
  border:0;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  padding:7px 2px 8px;
  font-size:13px;
  font-weight:700;
  color:var(--mut);
  border-radius:0;
  box-shadow:none;
}

.ctab:hover{
background:none;
  color:var(--ac);
  opacity:1;
  transform:none;
  box-shadow:none;
}

.ctab.on{
background:none;
  color:var(--ac);
  border-bottom-color:var(--ac);
  box-shadow:none;
}

.frow{
display:flex;
  gap:10px;
  align-items:center;
  margin-top:14px;
  flex-wrap:wrap;
}

#list h2{
margin-top:18px;
}

.fmlab{
font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-weight:700;
  color:var(--mut);
}

/* ranking sheet: hairline rows, no cards */
.sheet{
background:var(--card);
  border:1px solid var(--bd);
  border-radius:var(--r-sheet);
  margin-top:12px;
  overflow:hidden;
}

.rrow{
display:grid;
  grid-template-columns:38px 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px 16px;
  border-top:1px solid var(--bd);
  text-decoration:none;
  color:inherit;
}

.rrow:first-child{
border-top:0;
}

.rrow:hover{
background:var(--ac-soft);
  text-decoration:none;
  color:inherit;
}

.rrow.norank{
grid-template-columns:1fr auto;
}

.rrank{
font-size:15px;
  font-weight:700;
  text-align:right;
  color:var(--tx);
  font-variant-numeric:tabular-nums;
}

.rname{
font-size:15.5px;
  font-weight:600;
  letter-spacing:-.1px;
}

.rmeta{
margin-top:4px;
}

.rscore{
text-align:right;
  white-space:nowrap;
}

.ravg{
font-size:16px;
  font-weight:700;
}

.ravg .stars{
font-size:12px;
}

/* podium: top 3 centered, visual order 2-1-3, sheet continues at 4th */
.podium{
display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:12px;
  margin-top:12px;
}

.p-card{
flex:1 1 0;
  min-width:0;
  max-width:250px;
  min-height:158px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:4px;
  padding:18px 14px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:var(--r-sheet);
  text-decoration:none;
  color:inherit;
}

.p-card[data-pos="2"]{
order:1;
}

.p-card[data-pos="1"]{
order:2;
}

.p-card[data-pos="3"]{
order:3;
}

.p-card:hover{
background:var(--ac-soft);
  text-decoration:none;
  color:inherit;
}

.p-card .pnum{
font-size:30px;
  font-weight:700;
  line-height:1;
  color:var(--tx);
  font-variant-numeric:tabular-nums;
}

.p-card .rname{
text-align:center;
  overflow-wrap:anywhere;
}

.p-card .ravg{
margin-top:2px;
}

.p-card.first{
min-height:196px;
  background:var(--ac);
  border-color:var(--ac);
  color:var(--on-ac);
}

.p-card.first:hover{
background:var(--ac);
  color:var(--on-ac);
}

.p-card.first .pnum{
font-size:44px;
  color:var(--on-ac);
}

.p-card.first .rname,
.p-card.first .ravg{
color:var(--on-ac);
}

.p-card.first .fchip{
background:transparent;
  border-color:transparent;
  color:var(--on-ac);
}

.p-card.first .mut{
color:var(--on-ac);
  opacity:.75;
}

@media (max-width:560px){
  .podium{
    gap:8px;
  }
  .p-card{
    min-height:140px;
    padding:14px 8px;
  }
  .p-card .pnum{
    font-size:26px;
  }
  .p-card.first{
    min-height:168px;
  }
  .p-card.first .pnum{
    font-size:36px;
  }
}
</style>
</head>

<body>
<a class="skip" href="#main">Saltar para o conteúdo</a>

<div class="top">
  <b>Escola Comércio Lisboa</b>
  <span class="sub">· Avaliação de professores</span>
  <nav>
    <a href="index.html">Professores</a>
    <a href="top.html" class="on">Top</a>
    <a href="forum.html">Fórum</a>
    <span id="acct" class="acct"></span>
  </nav>
</div>

<div class="wrap" id="main">

  <div id="cfgWarn" class="warn hide">
    A base de dados ainda não está configurada.
  </div>

  <div id="truncWarn" class="warn hide">
    A mostrar os dados mais recentes (limite de 1000 por tabela).
  </div>

  <h1>Top Professores</h1>

  <div class="sortrow">
    <div class="seg" role="group" aria-label="Modo de ordenação">
      <button id="sortCount" class="sortbtn on" data-mode="count" aria-pressed="true">Mais avaliados</button>
      <button id="sortAvg" class="sortbtn" data-mode="avg" aria-pressed="false">Melhores média</button>
    </div>
  </div>

  <div class="ctabs" id="critTabs" role="group" aria-label="Critério da pontuação">
    <button class="ctab on" data-crit="m" aria-pressed="true">Média</button>
    <button class="ctab" data-crit="c" aria-pressed="false">Clareza</button>
    <button class="ctab" data-crit="a" aria-pressed="false">Apoio</button>
    <button class="ctab" data-crit="j" aria-pressed="false">Justiça</button>
  </div>

  <div class="frow">
    <span class="fmlab">Função</span>
    <div class="chips" id="roleChips" role="group" aria-label="Filtrar por função"></div>
  </div>

  <div id="list">
    <div class="card">
      <div class="sk sk-line" style="width:65%"></div>
      <div class="sk sk-line" style="width:40%;margin-top:10px"></div>
      <div class="sk sk-line" style="width:75%;margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="sk sk-line" style="width:55%"></div>
      <div class="sk sk-line" style="width:30%;margin-top:10px"></div>
      <div class="sk sk-line" style="width:70%;margin-top:10px"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>

<script src="app.js"></script>

<script>

(function(){

var $ = ECL.$;
var esc = ECL.esc;
var configured = ECL.configured;
var sb = ECL.sb;

var teachers = [];
var ratings = [];
var loaded = false;

var sortMode = "count";
var crit = "m";
var roleF = "all";

var CRIT_LABEL = {
  m:"média",
  c:"clareza",
  a:"apoio",
  j:"justiça"
};

ECL.paintAcct("top.html");

function avg(list,k){

  if(!list.length)
    return 0;

  return list.reduce(function(a,x){
    return a + Number(x[k]);
  },0) / list.length;

}

function groupOf(s){

  s = String(s || "").toLowerCase();

  if(s.indexOf("formador") === 0)
    return "formador";

  if(s.indexOf("docente") === 0)
    return "docente";

  if(s.indexOf("coord") === 0)
    return "coord";

  return "outros";

}

var ROLE_GROUPS = [
  { k:"formador", label:"Formador(a)" },
  { k:"docente", label:"Docente" },
  { k:"coord", label:"Coord." },
  { k:"outros", label:"Outros" }
];

function val(x){

  if(crit === "c")
    return x.c;

  if(crit === "a")
    return x.a;

  if(crit === "j")
    return x.j;

  return x.m;

}

function sortFn(a,b){

  if(sortMode === "count"){
    return (b.n - a.n) ||
      (val(b) - val(a)) ||
      String(a.t.name).localeCompare(String(b.t.name),"pt");
  }

  return (val(b) - val(a)) ||
    (b.n - a.n) ||
    String(a.t.name).localeCompare(String(b.t.name),"pt");

}

function hdrText(){

  if(sortMode === "count")
    return "Ordenado por número de avaliações · mínimo de 3 avaliações";

  return "Ordenado por " + CRIT_LABEL[crit] +
    " · mínimo de 3 avaliações";

}

function stateHtml(txt){
  return '<div class="state">' + esc(txt) + '</div>';
}

function rowHtml(x,ranked){

  var v = val(x);

  return '<a class="rrow' + (ranked ? "" : " norank") +
    '" href="teacher.html?id=' + x.t.id + '">' +

    (ranked
      ? '<div class="rrank">' + x.pos + '</div>'
      : "") +

    '<div class="rmain">' +
      '<div class="rname">' + esc(x.t.name) + '</div>' +
      '<div class="rmeta">' +
        '<span class="fchip">' + esc(x.t.subject) + '</span>' +
      '</div>' +
    '</div>' +

    '<div class="rscore">' +
      '<div class="ravg">' +
        '<span class="stars">★</span> ' + v.toFixed(1) +
      '</div>' +
      '<div class="mut">' +
        x.n + ' avaliaç' + (x.n === 1 ? "ão" : "ões") +
      '</div>' +
    '</div>' +

  '</a>';

}

function sheetHtml(rows,ranked){
  return '<div class="sheet">' +
    rows.map(function(x){
      return rowHtml(x,ranked);
    }).join("") +
    '</div>';
}

function podiumHtml(list){

  if(!list.length)
    return "";

  var html = '<div class="podium">';

  list.forEach(function(x,i){

    var pos = i + 1;
    var v = val(x);

    html +=
      '<a class="p-card' + (pos === 1 ? " first" : "") +
        '" data-pos="' + pos +
        '" href="teacher.html?id=' + x.t.id + '">' +
        '<div class="pnum">' + pos + '</div>' +
        '<div class="rname">' + esc(x.t.name) + '</div>' +
        '<div class="rmeta">' +
          '<span class="fchip">' + esc(x.t.subject) + '</span>' +
        '</div>' +
        '<div class="ravg">' +
          '<span class="stars">★</span> ' + v.toFixed(1) +
        '</div>' +
        '<div class="mut">' +
          x.n + ' avaliaç' + (x.n === 1 ? "ão" : "ões") +
        '</div>' +
      '</a>';

  });

  return html + '</div>';

}

function renderChips(all){

  var present = {};

  all.forEach(function(x){
    present[groupOf(x.t.subject)] = true;
  });

  var html =
    '<button type="button" class="chip' + (roleF === "all" ? " on" : "") +
    '" data-role="all" aria-pressed="' + (roleF === "all") + '">' +
    'Todas' +
    '</button>';

  ROLE_GROUPS.forEach(function(g){

    if(!present[g.k])
      return;

    html +=
      '<button type="button" class="chip' + (roleF === g.k ? " on" : "") +
      '" data-role="' + g.k + '" aria-pressed="' + (roleF === g.k) + '">' +
      esc(g.label) +
      '</button>';

  });

  $("roleChips").innerHTML = html;

}

function render(){

  if(!configured){

    $("list").innerHTML =
      stateHtml("Configure a base de dados para ver o ranking.");

    return;

  }

  if(!loaded){

    $("list").innerHTML = stateHtml("A carregar…");

    return;

  }

  var all = teachers.map(function(t){

    var r = ratings.filter(function(x){
      return Number(x.teacher_id) === Number(t.id);
    });

    var c = avg(r,"clareza");
    var a = avg(r,"apoio");
    var j = avg(r,"justica");
    var m = r.length ? (c + a + j) / 3 : 0;

    return { t:t, n:r.length, c:c, a:a, j:j, m:m };

  }).filter(function(x){
    return x.n > 0;
  });

  if(!all.length){

    renderChips([]);

    $("list").innerHTML =
      stateHtml("Ainda não há avaliações. Seja o primeiro a avaliar!");

    return;

  }

  renderChips(all);

  var rows = all.filter(function(x){
    return roleF === "all" || groupOf(x.t.subject) === roleF;
  });

  if(!rows.length){

    $("list").innerHTML =
      stateHtml("Nenhum professor corresponde a esta função.");

    return;

  }

  var ranked = rows.filter(function(x){
    return x.n >= 3;
  }).sort(sortFn);

  var few = rows.filter(function(x){
    return x.n < 3;
  }).sort(sortFn);

  ranked.forEach(function(x,i){
    x.pos = i + 1;
  });

  var top3 = ranked.slice(0,3);
  var rest = ranked.slice(3);

  $("list").innerHTML =

    '<h2 id="rankHdr">' +
      esc(hdrText()) +
    '</h2>' +

    (ranked.length
      ? podiumHtml(top3) +
        (rest.length ? sheetHtml(rest,true) : "")
      : stateHtml("Ainda não há professores com 3 ou mais avaliações.")) +

    (few.length
      ? '<h2>Avaliados poucas vezes · sem posição</h2>' +
        sheetHtml(few,false)
      : "");

}

function loadAll(){

  if(!configured)
    return;

  ECL.cached("d-index", 300000, function(){
    return Promise.all([

      sb
        .from("teachers")
        .select("*")
        .order("name")
        .limit(1000),

      sb
        .from("ratings")
        .select("*")
        .order("id",{ascending:false})
        .limit(1000)

    ]).then(function(res){

      if(res[0].error || res[1].error)
        return Promise.reject(res[0].error || res[1].error);

      return {
        teachers: res[0].data || [],
        ratings: res[1].data || []
      };

    });
  }).then(function(d){

    teachers = d.teachers;
    ratings = d.ratings;
    loaded = true;

    var tw = $("truncWarn");
    if(tw){
      tw.classList.toggle(
        "hide",
        teachers.length < 1000 && ratings.length < 1000
      );
    }

    render();

  }).catch(function(){
    $("list").innerHTML =
      stateHtml("Erro a carregar dados.");
  });

}

function setPressed(container,attr,value){

  var btns = container.querySelectorAll("[" + attr + "]");

  for(var i = 0; i < btns.length; i++){

    var b = btns[i];
    var on = b.getAttribute(attr) === value;

    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",String(on));

  }

}

function setMode(m){

  sortMode = m;

  setPressed(document.querySelector(".seg"),"data-mode",m);

  render();

}

$("sortAvg").onclick = function(){
  setMode("avg");
};

$("sortCount").onclick = function(){
  setMode("count");
};

$("critTabs").addEventListener("click",function(e){

  var b = e.target.closest("[data-crit]");

  if(!b)
    return;

  crit = b.getAttribute("data-crit");

  setPressed($("critTabs"),"data-crit",crit);

  render();

});

$("roleChips").addEventListener("click",function(e){

  var b = e.target.closest("[data-role]");

  if(!b)
    return;

  roleF = b.getAttribute("data-role");

  render();

});

loadAll();

render();

})();

</script>

</body>
</html>
